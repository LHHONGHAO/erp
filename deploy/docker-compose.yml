services:
  mysql:
    image: mysql:8.4
    container_name: jsherp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: jsh_erp
      MYSQL_USER: jsherp
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deploy/.env}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - ${JSHERP_DATA_ROOT:-/srv/jsherp-data}/mysql:/var/lib/mysql
      - ${JSHERP_BACKUP_ROOT:-/srv/jsherp-backup}/mysql:/backup
    restart: always
    networks:
      - jsherp

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - jsherp

  app:
    image: eclipse-temurin:8-jre
    container_name: jsherp-app
    depends_on:
      - mysql
      - redis
    ports:
      - "127.0.0.1:9998:9998"
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jsh_erp?useUnicode=true&characterEncoding=utf8&useCursorFetch=true&defaultFetchSize=500&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: jsherp
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deploy/.env}
      SPRING_REDIS_HOST: redis
      SPRING_RESOURCES_STATIC_LOCATIONS: classpath:/static/,file:/app/static/
      SERVER_TOMCAT_BASEDIR: /tmp/tomcat
      FILE_PATH: /data/upload
      FILE_EXPORTTMP: /data/export
    volumes:
      - ./jshERP.jar:/app/jshERP.jar:ro
      - ./dist:/app/static:ro
      - ${JSHERP_DATA_ROOT:-/srv/jsherp-data}/app:/data
    command: ["java", "-Djsh.data.dir=/data", "-Dlogs.home=/data/logs", "-jar", "/app/jshERP.jar"]
    restart: always
    networks:
      - jsherp

  nginx:
    image: nginx:alpine
    container_name: jsherp-nginx
    depends_on:
      - app
    ports:
      - "9999:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config:/etc/nginx/certs:ro
    restart: always
    networks:
      - jsherp

networks:
  jsherp:
