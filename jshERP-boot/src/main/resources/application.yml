# 服务端口
server:
  port: 9999
  servlet:
    # 登录超时 - 秒
    session:
      timeout: 36000
    # 服务路径
    context-path: /jshERP-boot
  tomcat:
    # 文件上传临时路径（使用用户 Temp 目录，避免 C:\opt 被 Windows Defender 拦截）
    basedir: C:/Users/Administrator/AppData/Local/Temp/tomcat

spring:
  # 前端打包产物（npm run build）直接由后端同源托管，省去 nginx
  # 默认读取启动目录下的 frontend-dist（部署脚本会同步该目录）；可用 -Dspring.resources.static-locations 覆盖
  resources:
    static-locations: classpath:/static/,file:./frontend-dist/
  datasource:
    # 数据库连接
    url: jdbc:mysql://127.0.0.1:3306/jsh_erp?useUnicode=true&characterEncoding=utf8&useCursorFetch=true&defaultFetchSize=500&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    #password: 1234abcd
  servlet:
    multipart:
      # 文件上传限制 (byte)
      max-file-size: 10485760
      max-request-size: 10485760

# mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath:./mapper_xml/*.xml

# 租户对应的角色 id
manage:
  roleId: 10

tenant:
  # 租户允许创建的用户数
  userNumLimit: 1000000
  # 租户允许试用的天数
  tryDayLimit: 3000

# 插件配置
plugin:
  runMode: prod
  pluginPath: plugins
  pluginConfigFilePath: pluginConfig

file:
  # 文件上传方式 1-本机 2-oss
  uploadType: 1
  # 统一数据目录：数据库备份、图片、导出缓存、外部配置都放这里，重新部署不影响数据
  # 可用启动参数 -Djsh.data.dir=... 覆盖，未指定时用下面的默认值
  dataDir: ${jsh.data.dir:E:/huaxia/jshERP-data}
  # 文件上传根目录（商品图片等）
  path: ${jsh.data.dir:E:/huaxia/jshERP-data}/upload
  # 文件导出缓存
  exportTmp: ${jsh.data.dir:E:/huaxia/jshERP-data}/export

