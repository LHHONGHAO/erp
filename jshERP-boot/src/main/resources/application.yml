# 服务端口：约定 HTTPS 默认使用 9999 对外访问，HTTP 仅保留 9998 用于证书安装与兼容
server:
  port: 9998
  servlet:
    # 登录超时 - 秒
    session:
      timeout: 36000
    # 服务路径：部署访问地址只到端口，不加工程/页面后缀
    context-path: /
  tomcat:
    # 文件上传临时路径（使用用户 Temp 目录，避免 C:\opt 被 Windows Defender 拦截）
    basedir: C:/Users/Administrator/AppData/Local/Temp/tomcat

# HTTPS 连接器：对外统一使用 https://<主机>:9999 访问
jsh:
  https:
    port: 9999

spring:
  # 前端打包产物（npm run build）直接由后端同源托管，省去 nginx
  # 默认读取启动目录下的 frontend-dist（部署脚本会同步该目录）；可用 -Dspring.resources.static-locations 覆盖
  resources:
    static-locations: classpath:/static/,file:./frontend-dist/
  datasource:
    # 数据库连接通过部署环境注入；生产账号应使用仅访问 jsh_erp 的专用账号
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/jsh_erp?useUnicode=true&characterEncoding=utf8&useCursorFetch=true&defaultFetchSize=500&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:jsherp}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  redis:
    host: ${SPRING_REDIS_HOST:127.0.0.1}
    port: ${SPRING_REDIS_PORT:6379}
    # 无密码时保持未设置；需要认证时由 SPRING_REDIS_PASSWORD 环境变量注入
  servlet:
    multipart:
      # 文件上传限制 (byte)
      max-file-size: 10485760
      max-request-size: 10485760

# mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath:./mapper_xml/*.xml

# 租户对应的角色 id
manage:
  roleId: 10

tenant:
  # 租户允许创建的用户数
  userNumLimit: 1000000
  # 租户允许试用的天数
  tryDayLimit: 3000

# 插件配置
plugin:
  runMode: prod
  pluginPath: plugins
  pluginConfigFilePath: pluginConfig

file:
  # 文件上传方式 1-本机 2-oss
  uploadType: 1
  # 应用持久化目录：上传文件、导出缓存和外部配置；数据库由外部 MySQL 管理
  # 可用启动参数 -Djsh.data.dir=... 或环境变量 JSH_DATA_DIR 覆盖
  dataDir: ${jsh.data.dir:${JSH_DATA_DIR:./data}}
  # 文件上传根目录（商品图片等）
  path: ${file.dataDir}/upload
  # 文件导出缓存
  exportTmp: ${file.dataDir}/export

# 百度OCR配置（密钥不写死在这里，统一在页面设置中配置，
# 落盘到 <数据目录>/config/ocr-config.properties，避免换机部署误用失效默认值）
ocr:
  baidu:
    enabled: true
    apiKey: ""
    secretKey: ""
    tokenUrl: https://aip.baidubce.com/oauth/2.0/token
    ocrUrl: https://aip.baidubce.com/rest/2.0/ocr/v1/general_basic
