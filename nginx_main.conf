events {
    ssl_preread on;
}

stream {
    # 同一个 443 端口同时处理 HTTP 和 HTTPS
    # 检测到 TLS ClientHello → 转 HTTPS server
    # 否则 → 转 HTTP server（返回 301 跳转）
    map $ssl_preread_protocol $backend {
        default ssl_server;
        ""      http_server;
    }

    upstream ssl_server { server 127.0.0.1:8443; }
    upstream http_server { server 127.0.0.1:8080; }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend;
    }
}
